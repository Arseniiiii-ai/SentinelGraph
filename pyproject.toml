[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelgraph"
version = "0.6.0.dev0"
description = "Production fraud, account-takeover, and risk intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "joblib>=1.4,<2",
  "numpy>=2.0,<2.4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.0",
  "scikit-learn>=1.7,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
sentinelgraph-data = "sentinelgraph.data.pipeline:main"
sentinelgraph-baselines = "sentinelgraph.modeling.train:main"
sentinelgraph-behaviour = "sentinelgraph.modeling.advanced:main"
sentinelgraph-graph = "sentinelgraph.modeling.graph_train:main"
sentinelgraph-risk = "sentinelgraph.modeling.risk_train:main"
sentinelgraph-api = "sentinelgraph.api.cli:main"
sentinelgraph-api-report = "sentinelgraph.api.benchmark:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: validates tracked and locally generated release artifacts",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true
