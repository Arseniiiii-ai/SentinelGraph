<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SentinelGraph Investigator Console</title>
    <link rel="stylesheet" href="/static/dashboard.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">SentinelGraph {{ release }}</p>
        <h1>Investigator Console</h1>
      </div>
      <span class="human">Human decision required</span>
    </header>
    <main>
      <section class="controls" aria-label="Queue controls">
        <label>API key <input id="api-key" type="password" autocomplete="off"></label>
        <label>Status
          <select id="status-filter">
            <option value="">All</option><option>open</option>
            <option>in_review</option><option>closed</option>
          </select>
        </label>
        <button id="load-cases">Load queue</button>
        <span id="message" role="status"></span>
      </section>
      <section class="workspace">
        <div class="queue-panel">
          <div class="section-title"><h2>Risk queue</h2><span id="case-count">0 cases</span></div>
          <div id="case-list" class="case-list"></div>
        </div>
        <article id="case-detail" class="detail-panel">
          <p class="empty-state">Select a case to inspect evidence and record a decision.</p>
        </article>
      </section>
    </main>
    <script src="/static/dashboard.js" defer></script>
  </body>
</html>
